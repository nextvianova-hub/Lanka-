<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100svh;display:grid;place-items:center;padding:28px 20px;

p{font-size:15px;color:#5A6A66}
a.btn{margin-top:6px;display:inline-block;background:#0E4D45;color:#fff;text-decoration:none;
  font-weight:700;font-size:15px;padding:13px 26px;border-radius:12px}

</head>

<div class="box">
