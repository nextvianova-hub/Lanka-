<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ලංකා ගමන් සිතියම · Sri Lanka Travel Map</title>
<meta name="description" content="ශ්‍රී ලංකාවේ සංචාරක ස්ථාන සහ ප්‍රාදේශීය කෑම හොයාගන්න නොමිලේ සිතියමක්. A free map of places to visit and local food across Sri Lanka.">
<meta name="theme-color" content="#0E4D45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ගමන් සිතියම">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="lib/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E4D45;--teal2:#14695E;--sand:#F6F1E7;--ink:#17201E;--muted:#5D6B67;--line:#E2E6E3;--bg:#FBFAF7;--accent:#E8A33A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Noto Sans Sinhala",Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
html[lang=en] body{font-family:Manrope,"Noto Sans Sinhala",system-ui,sans-serif}
html[lang=ta] body{font-family:"Noto Sans Tamil",Manrope,system-ui,sans-serif}
button,input,select{font-family:inherit}
header{background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand>div{min-width:0}.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{flex:none}
.brand b{display:block;font-size:18px;line-height:1.2}
.brand small{display:block;font-size:12.5px;color:#BFE0D9;line-height:1.3}
.hbtn{margin-left:auto;display:flex;align-items:center;gap:7px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13.5px;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.hbtn .n{background:var(--accent);color:#2A1A00;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:12px;padding:0 5px}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;color:#fff;font-weight:700;font-size:13px;padding:6px 10px;border-radius:999px;cursor:pointer;font-family:Manrope,"Noto Sans Sinhala","Noto Sans Tamil",sans-serif}
.lang button.on{background:#fff;color:var(--teal)}
main{flex:1;display:grid;grid-template-columns:420px minmax(0,1fr);min-height:0}
aside{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;border-right:1px solid var(--line);background:#fff}
.tools,.tools>*{min-width:0}
.tools{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.search{position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;background:var(--bg)}
.search input:focus{outline:none;border-color:var(--teal2);background:#fff}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.row{display:flex;gap:8px}
.row select{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;min-width:0}
.row .btn{flex:none;max-width:55%}.row .btn span{overflow:hidden;text-overflow:ellipsis}
.pop .acts .btn{white-space:normal;text-align:center;line-height:1.25}
html[lang=ta] .chip{font-size:12.5px;padding:6px 10px}html[lang=ta] .btn{font-size:13px}
.btn-teal{background:var(--teal);color:#fff}
.btn-light{background:var(--sand);color:var(--teal)}
.btn-amber{background:var(--accent);color:#2A1A00}
.count{font-size:13px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.list{overflow-y:auto;flex:1}
.card{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.card:hover{background:var(--bg)}
.card.sel{background:#EEF6F4;box-shadow:inset 3px 0 0 var(--teal2)}
.dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:16px;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.card b{display:block;font-size:15px;line-height:1.35}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .side{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.card .km{font-size:12.5px;font-weight:700;color:var(--teal2);white-space:nowrap}
.add{border:1.5px solid var(--line);background:#fff;border-radius:999px;width:30px;height:30px;font-size:16px;cursor:pointer;display:grid;place-items:center;color:var(--teal);flex:none}
.add.in{background:var(--teal);border-color:var(--teal);color:#fff}
.empty{padding:30px 16px;color:var(--muted);text-align:center}
#map{min-height:0;height:100%;background:#CFE4EA}
.dlabel span{display:block;text-align:center;font-size:11.5px;font-weight:700;color:#4E6A63;text-shadow:0 0 3px #F4F1E8,0 0 3px #F4F1E8;white-space:nowrap}
.leaflet-container{font-family:inherit}
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s;position:relative}
.pin.sel{transform:scale(1.35);box-shadow:0 0 0 4px rgba(14,77,69,.35),0 2px 6px rgba(0,0,0,.35)}
.pin .no{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#2A1A00;font:800 11px Manrope,sans-serif;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;border:2px solid #fff}
.clu{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;font:800 14px Manrope,sans-serif;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 5px rgba(14,77,69,.25),0 2px 8px rgba(0,0,0,.3)}
.clu.big{width:48px;height:48px;font-size:15px}
.leaflet-popup-content{margin:14px 16px;min-width:230px;max-width:280px}
.pop h3{font-size:16.5px;line-height:1.3;margin-bottom:2px}
.pop .alt{font-size:12.5px;color:var(--muted)}
.pop .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin:8px 0 6px;padding:3px 9px;border-radius:999px;background:var(--sand)}
.pop p{font-size:14px;line-height:1.55;margin:0 0 12px!important}
.pop .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.month{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:0 0 0 12px;background:#fff}
.month select{flex:1;min-width:0;border:0;padding:10px 12px 10px 0;font-size:14px;background:transparent;font-weight:600;color:var(--ink)}
.month.on{border-color:var(--teal2);background:#EEF6F4}
.season{margin:0 0 10px}
.season small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.mstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.mstrip i{font-style:normal;font-size:9.5px;font-weight:700;text-align:center;padding:3px 0;border-radius:4px;background:#EEE9DF;color:#9A9384}
.mstrip i.g{background:#1B9E77;color:#fff}
.mstrip i.now{outline:2px solid var(--ink);outline-offset:-1px}
.snote{font-size:12px;color:#8A5300;background:#FFF4DF;border-radius:8px;padding:5px 8px;margin-top:6px;line-height:1.45}
.wx{margin:0 0 12px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;min-height:20px}
.wx .days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.wx .days b{display:block;font-size:12px;color:var(--muted)}
.wx .days .ic{font-size:20px;line-height:1.3}
.wx .days .t{font-weight:800;font-size:13px}
.wx .days .r{color:#2A6FDB;font-weight:700;font-size:11.5px}
.wx .src{display:block;margin-top:6px;font-size:10.5px;color:var(--muted);text-align:right}
.wx .src a{color:var(--muted)}
.card .good{display:inline-block;font-size:11px;font-weight:700;color:#11694F;background:#E3F4EC;border-radius:999px;padding:1px 7px;margin-left:4px}
.pop .acts .btn{padding:9px 8px;font-size:13px}
.leaflet-container .pop a.btn-teal{color:#fff}.leaflet-container .pop a.btn-amber{color:#2A1A00}
.me{width:18px;height:18px;border-radius:50%;background:#2A6FDB;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,111,219,.25)}
.legend{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);font-size:12.5px;line-height:1.9}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-style:normal;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.note{font-size:11.5px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line);line-height:1.5;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* trip drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.4);z-index:1500;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.trip{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:100%;background:#fff;z-index:1600;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.trip.open{transform:none}
.trip-h{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.trip-h b{font-size:18px}
.trip-h button{margin-left:auto;border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1}
.trip-list{flex:1;overflow-y:auto}
.tl{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tl .num{width:26px;height:26px;border-radius:50%;background:var(--accent);font:800 13px Manrope,sans-serif;display:grid;place-items:center;flex:none}
.tl .nm{flex:1;min-width:0}.tl .nm b{display:block;font-size:14.5px;line-height:1.35}.tl .nm small{color:var(--muted);font-size:12px}
.tl .ctl{display:flex;gap:4px}
.tl .ctl button{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--ink)}
.tl .ctl button:disabled{opacity:.35;cursor:default}
.trip-f{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
.trip-f p{font-size:12px;color:var(--muted);line-height:1.5}
.trip-empty{padding:30px 20px;color:var(--muted);text-align:center;line-height:1.6}
/* install */
.inst{position:fixed;left:16px;bottom:16px;z-index:1400;display:none;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 12px 34px rgba(0,0,0,.25);max-width:420px;width:calc(100% - 32px)}
.inst.show{display:flex}
.inst img{border-radius:10px;flex:none}
.inst div{flex:1;min-width:0}.inst b{display:block;font-size:14.5px}.inst small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.inst .x{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
.inst.ios #inst_go{display:none}
/* photos */
.photo{margin:-14px -16px 10px;height:150px;background:#E9E5DC;border-radius:12px 12px 0 0;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo a.cr{position:absolute;right:6px;bottom:6px;font-size:10px;background:rgba(0,0,0,.55);color:#fff!important;padding:2px 6px;border-radius:6px;text-decoration:none}
.photo.none{display:none}
.leaflet-popup-content-wrapper{overflow:hidden}
.vbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-weight:700;font-size:12.5px;cursor:pointer;margin:0 0 10px;color:var(--ink)}
.vbtn.on{background:#FFF4DF;border-color:#E8A33A;color:#7A4B00}
.card .star{font-size:13px;margin-left:4px}
/* visited */
.vis-top{padding:16px;border-bottom:1px solid var(--line)}
.vis-big{display:flex;align-items:baseline;gap:8px}.vis-big b{font:800 36px Manrope,sans-serif;color:var(--teal)}.vis-big span{color:var(--muted);font-weight:600}
.bar{height:10px;background:var(--sand);border-radius:99px;overflow:hidden;margin:10px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1B9E77,#E8A33A);border-radius:99px;transition:width .4s}
.vis-cats{display:flex;flex-wrap:wrap;gap:6px}
.vis-cats span{font-size:12.5px;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
/* railways */
.rail-btn{background:#fff;border:0;width:34px;height:34px;border-radius:8px;font-size:18px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.25)}
.rail-btn.on{background:var(--teal);color:#fff}
.stn{width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid #333}
.rail-pop h3{font-size:16px;margin-bottom:6px}.rail-pop p{font-size:13.5px;line-height:1.55;margin:0 0 8px!important}.rail-pop small{color:var(--muted);font-size:11.5px}
/* more places (OpenStreetMap) */
.more-btn{background:#fff;border:0;border-radius:999px;padding:8px 13px;font:700 13px inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.28);color:var(--teal);display:flex;align-items:center;gap:6px;white-space:nowrap}
.more-btn.off{color:#8B9692}
.more-btn.busy{opacity:.75;cursor:progress}
.more-wrap{display:flex;gap:6px}
.more-x{background:#fff;border:0;border-radius:999px;width:34px;font-size:15px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.28);color:var(--muted)}
.opin{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#fff;border:2px solid;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.oclu{width:30px;height:30px;border-radius:50%;background:#fff;color:#5D6B67;font:800 12px Manrope,sans-serif;display:grid;place-items:center;border:2px solid #9AA8A3;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pop .osm-note{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 8px;margin:6px 0 10px;line-height:1.45}
.pop .osm-note a{color:var(--teal2)}
/* SOS */
.sos-ctl{background:#C62828;color:#fff;border:3px solid #fff;width:52px;height:52px;border-radius:50%;font:800 14px Manrope,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(198,40,40,.45)}
.sos-sheet{position:fixed;inset:0;z-index:2500;background:rgba(10,20,18,.55);display:none;align-items:flex-end;justify-content:center}
.sos-sheet.open{display:flex}
.sos-box{background:#fff;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:821px){.sos-sheet{align-items:center}.sos-box{border-radius:22px}}
.sos-h{display:flex;align-items:center;margin-bottom:10px}.sos-h b{font-size:18px;color:#B3261E}
.sos-h button{margin-left:auto;border:0;background:none;font-size:28px;cursor:pointer;color:var(--muted);line-height:1}
.sos-row{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;margin-bottom:8px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.sos-row:hover{border-color:#C62828}
.sos-row .ic{font-size:22px;width:30px;text-align:center}
.sos-row .nm{flex:1;font-weight:700;font-size:14.5px;line-height:1.35}.sos-row .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.sos-row .no{font:800 20px Manrope,sans-serif;color:#B3261E}
.sos-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 6px}
.sos-links .btn{white-space:normal;line-height:1.3;text-align:center}
.sos-confirm{text-align:center;padding:6px 4px}
.sc-num{font:800 52px Manrope,sans-serif;color:#B3261E;line-height:1.1}
.sc-name{font-weight:700;font-size:16px;margin:4px 0 18px}
.hold{position:relative;overflow:hidden;width:100%;border:0;border-radius:16px;background:#C62828;color:#fff;font-weight:800;font-size:18px;padding:20px 12px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;font-family:inherit}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.28)}
.hold span{position:relative}
.sc-help{font-size:13px;color:var(--muted);margin:10px 0 14px;line-height:1.5}
.sos-confirm .btn{width:100%}
.sos-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}
@media (max-width:820px){
  body{display:block;height:auto}
  header{position:sticky;top:0;z-index:1200;padding:8px 12px;gap:8px}
  main{display:flex;flex-direction:column}
  #map{height:52vh;order:1;position:sticky;top:54px;z-index:1}
  aside{order:2;border-right:0}
  .list{overflow:visible}
  .brand small{display:none}.brand b{font-size:15.5px}
  .hbtn{padding:7px 9px}.hbtn .lbl{display:none}
  .photo{height:120px}
  #map:has(.leaflet-popup) .more-wrap,#map:has(.leaflet-popup) .rail-btn,#map:has(.leaflet-popup) .leaflet-control-zoom{visibility:hidden}
}
@media (max-width:480px){
  .brand>div{display:none}
  .lang button{padding:6px 8px;font-size:12px}
  .leaflet-control.legend{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#fff"/><path d="M17 7c-4 0-7 3-7 7 0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z" fill="#0E4D45"/><circle cx="17" cy="14" r="2.8" fill="#E8A33A"/></svg>
    <div><b data-i="title"></b><small data-i="sub"></small></div>
  </div>
  <button class="hbtn" id="visBtn">⭐ <span class="lbl" data-i="visited"></span><span class="n" id="visN">0</span></button>
  <button class="hbtn" id="tripBtn" style="margin-left:0">🧳 <span class="lbl" data-i="trip"></span><span class="n" id="tripN">0</span></button>
  <div class="lang"><button data-l="si">සිං</button><button data-l="ta">தமிழ்</button><button data-l="en">EN</button></div>
</header>
<main>

let lang = "si", cat = "all", dist = "", q = "", me = null, selId = null, month = 0;
const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
const BY = Object.fromEntries(PLACES.map(p => [p.id, p]));
const name = p => p[lang];
const alt = p => lang === "en" ? p.si : p.en;
const desc = p => ({si:p.dsi, ta:p.dta, en:p.den})[lang];
const dname = d => lang === "en" ? d : (DN[lang][d] || d);
const gq = p => p.osm ? `${p.lat},${p.lng}` : encodeURIComponent(p.c === "food" ? `${p.en}, ${p.d}, Sri Lanka` : `${p.en}, Sri Lanka`);
function getP(id){
  if (BY[id]) return BY[id];
  if (!id || !id.startsWith("o|")) return null;
  const [, oid, lat, lng, nm, c, ic] = id.split("|");
  if (!oid || isNaN(+lat) || isNaN(+lng)) return null;
  const n = decodeURIComponent(nm || "");
  return {id, osm:oid, lat:+lat, lng:+lng, si:n, ta:n, en:n, c:CATS[c] ? c : "heritage", ic:decodeURIComponent(ic || "📍")};
}

const PH = {};
const WAPI = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail%7Cname&pithumbsize=600&pilicense=free";
async function loadPhoto(id){
  const box = () => document.querySelector(`.photo[data-id="${id}"]`);
  if (!WIKI[id]) { const b = box(); if (b) b.classList.add("none"); return; }
  if (!(id in PH)){
    try {
      let pg = Object.values((await (await fetch(WAPI + "&titles=" + encodeURIComponent(WIKI[id]))).json()).query?.pages || {})[0];
      if (!pg || !pg.thumbnail){
        const sr = await (await fetch(WAPI + "&generator=search&gsrlimit=1&gsrsearch=" + encodeURIComponent(BY[id].en + " Sri Lanka"))).json();
        pg = Object.values(sr.query?.pages || {})[0];
      }
      PH[id] = pg && pg.thumbnail ? {src:pg.thumbnail.source, file:pg.pageimage, title:pg.title} : null;
    } catch(e){ PH[id] = undefined; }
  }
  const b = box(); if (!b) return;
  const ph = PH[id];
  if (!ph){ b.classList.add("none"); if (ph === undefined) delete PH[id]; return; }
  b.innerHTML = `<img src="${ph.src}" alt="${name(BY[id])}" loading="lazy" onerror="this.parentElement.classList.add('none')">
    <a class="cr" target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/File:${encodeURIComponent(ph.file)}">📷 ${T[lang].photo}</a>`;
}

// ---------------- visited ----------------
let visited = new Set((store.get("visited") || "").split(",").filter(id => BY[id]));
const saveVis = () => { store.set("visited", [...visited].join(",")); $("visN").textContent = visited.size; };
function toggleVisited(id){ visited.has(id) ? visited.delete(id) : visited.add(id); saveVis(); refreshAll(); renderVis(); }
window.popVisited = id => setTimeout(() => toggleVisited(id), 0);
const PLACES_ONLY = PLACES.filter(p => p.c !== "food"), FOODS = PLACES.filter(p => p.c === "food");
function renderVis(){
  const vp = PLACES_ONLY.filter(p => visited.has(p.id)).length, vf = FOODS.filter(p => visited.has(p.id)).length;
  $("visPct").textContent = vp; $("visOf").textContent = T[lang].vof(PLACES_ONLY.length, vf, FOODS.length);
  $("visBar").style.width = (vp / PLACES_ONLY.length * 100) + "%";
  $("visCats").innerHTML = Object.entries(CATS).map(([k, v]) => { const all = PLACES.filter(p => p.c === k), n = all.filter(p => visited.has(p.id)).length;
    return `<span>${v.e} ${n}/${all.length}</span>`; }).join("");
  const list = PLACES.filter(p => visited.has(p.id));
  $("visList").innerHTML = list.length ? list.map(p => `<div class="tl"><span class="num" style="background:${CATS[p.c].c};color:#fff">${CATS[p.c].e}</span>
      <div class="nm"><b>${name(p)}</b><small>${dname(p.d)}</small></div><div class="ctl"><button data-v="${p.id}" aria-label="${T[lang].rm}">✕</button></div></div>`).join("")
    : `<div class="trip-empty">${T[lang].vempty}</div>`;
  $("visList").querySelectorAll("button[data-v]").forEach(b => b.onclick = () => toggleVisited(b.dataset.v));
}
const openVis = () => { renderVis(); $("vis").classList.add("open"); $("scrim").classList.add("open"); };
const closeVis = () => { $("vis").classList.remove("open"); $("scrim").classList.remove("open"); };
$("visShare").onclick = () => {
  const vp = PLACES_ONLY.filter(p => visited.has(p.id)).length, url = location.href.split("#")[0];
  const text = T[lang].vtext(vp, PLACES_ONLY.length);
  if (navigator.share) navigator.share({title:T[lang].title, text, url}).catch(()=>{});
  else navigator.clipboard?.writeText(text + " " + url).then(() => toast(T[lang].copied));
};

// ---------------- trip ----------------
let trip = (store.get("trip") || "").split(",").filter(id => getP(id));
const saveTrip = () => { store.set("trip", trip.join(",")); $("tripN").textContent = trip.length; };
function toggleTrip(id){
  if (id.startsWith("o|")){ const base = id.split("|").slice(0, 2).join("|") + "|"; const j = trip.findIndex(t => t.startsWith(base)); if (j >= 0) id = trip[j]; }
  const i = trip.indexOf(id);
  if (i >= 0){ trip.splice(i, 1); toast(T[lang].tremoved); } else { trip.push(id); toast(T[lang].tadded); }
  saveTrip(); refreshAll();
}
function moveTrip(i, d){ const j = i + d; if (j < 0 || j >= trip.length) return; [trip[i], trip[j]] = [trip[j], trip[i]]; saveTrip(); refreshAll(); }
function renderTrip(){
  $("tripList").innerHTML = trip.length ? trip.map((id, i) => { const p = getP(id); return `<div class="tl"><span class="num">${i+1}</span>
      <div class="nm"><b>${name(p)}</b><small>${p.osm ? p.ic + " " + T[lang].osmsrc : CATS[p.c].e + " " + dname(p.d)}</small></div>
      <div class="ctl"><button data-a="up" data-i="${i}" ${i===0?"disabled":""} aria-label="${T[lang].up}">↑</button><button data-a="down" data-i="${i}" ${i===trip.length-1?"disabled":""} aria-label="${T[lang].down}">↓</button><button data-a="rm" data-i="${i}" aria-label="${T[lang].rm}">✕</button></div></div>`; }).join("")
    : `<div class="trip-empty">${T[lang].tempty}</div>`;
  $("tripF").style.display = trip.length ? "grid" : "none";
  $("tripList").querySelectorAll("button").forEach(b => b.onclick = () => { const i = +b.dataset.i; b.dataset.a === "rm" ? toggleTrip(trip[i]) : moveTrip(i, b.dataset.a === "up" ? -1 : 1); });
  const stops = trip.slice(0, 10).map(getP);
  if (stops.length){
    const dest = stops[stops.length-1], wps = stops.slice(0, -1);
    $("tripRoute").href = "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + gq(dest) + (wps.length ? "&waypoints=" + wps.map(gq).join("%7C") : "");
  }
  drawTripLine();
}
$("tripRoute").addEventListener("click", () => { if (trip.length > 10) toast(T[lang].tmax); });
const openTrip = () => { renderTrip(); $("trip").classList.add("open"); $("scrim").classList.add("open"); };
const closeTrip = () => { $("trip").classList.remove("open"); $("scrim").classList.remove("open"); };
$("tripBtn").onclick = openTrip; $("tripClose").onclick = closeTrip; $("scrim").onclick = () => { closeTrip(); closeVis(); };
$("visBtn").onclick = openVis; $("visClose").onclick = closeVis;
$("tripClear").onclick = () => { if (confirm(T[lang].tconfirm)){ trip = []; saveTrip(); refreshAll(); } };
$("tripShare").onclick = () => {

  if (navigator.share) navigator.share({title:T[lang].trip, text:trip.map((id,i) => `${i+1}. ${name(getP(id))}`).join("\n"), url}).catch(()=>{});

};

const distMarkers = DISTRICTS.features.map(f => L.marker([f.properties.lat, f.properties.lng], {pane:"labels", interactive:false, keyboard:false, icon:labelIcon(f.properties.n)}));

const distLabels = L.layerGroup(distMarkers);

map.on("zoomend", showLabels);
// Street map on top, only when the site is online (OpenStreetMap blocks pages opened from a file).
if (location.protocol.startsWith("http")){
  let bad = 0;

}

function drawTripLine(){

const osmTripId = o => ["o", o.id, o.lat.toFixed(5), o.lng.toFixed(5), encodeURIComponent(osmName(o).replace(/[|,]/g, " ")), OT[o.type][0], encodeURIComponent(OT[o.type][1])].join("|");

async function loadOsm(){
  const btn = $("moreBtn");
  if (map.getZoom() < OSM_MINZOOM){ toast(T[lang].osmzoom); return; }
  const b = map.getBounds(), bb = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(v => v.toFixed(3)).join(",");
  if (osmLoaded.some(x => x.contains(b))){ toast(T[lang].osmsame); return; }
  const q = `[out:json][timeout:25];(
    nwr["tourism"~"^(attraction|viewpoint|museum|zoo|theme_park|picnic_site)$"]["name"](${bb});
    nwr["natural"~"^(waterfall|beach|peak|cave_entrance)$"]["name"](${bb});
    nwr["waterway"="waterfall"]["name"](${bb});
    nwr["historic"~"^(archaeological_site|ruins|fort|monument)$"]["name"](${bb});
    nwr["amenity"="place_of_worship"]["name"](${bb});
    nwr["amenity"~"^(restaurant|cafe|fast_food)$"]["name"](${bb});
  );out center tags ${OSM_MAX};`;
  btn.classList.add("busy"); btn.querySelector("span").textContent = T[lang].osmload;
  let data = null;
  for (const url of OVERPASS){
    try { const r = await fetch(url, {method:"POST", body:"data=" + encodeURIComponent(q), headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      if (r.ok){ data = await r.json(); break; } } catch(e){}
  }

  if (!data){ toast(T[lang].osmfail); return; }
  osmLoaded.push(b);

    const id = e.type[0] + e.id; if (OSM.has(id)) return;
    const t = e.tags || {}, type = osmType(t), lat = e.lat ?? e.center?.lat, lng = e.lon ?? e.center?.lon;
    if (!type || !t.name || lat == null) return;
    if (PLACES.some(p => p.c === OT[type][0] && Math.abs(p.lat - lat) < 0.0012 && Math.abs(p.lng - lng) < 0.0012)) return; // skip our own places
    const o = {id, t, type, lat, lng}; o.m = L.marker([lat, lng], {icon:osmIcon(o), pane:"osmPane", title:t.name}).bindPopup(() => osmPopup(o), POPOPT);

}

const WD = {si:["ඉරිදා","සඳුදා","අඟහරුවාදා","බදාදා","බ්‍රහස්පතින්දා","සිකුරාදා","සෙනසුරාදා"], ta:["ஞாயிறு","திங்கள்","செவ்வாய்","புதன்","வியாழன்","வெள்ளி","சனி"], en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]};
const NOWM = new Date().getMonth() + 1;
function bestText(b){
  if (b.length === 12) return T[lang].allyear;
  const set = new Set(b), runs = []; let start = null;
  for (let i = 0; i < 24; i++){ const m = i % 12 + 1, inS = set.has(m), prevIn = set.has((m + 10) % 12 + 1);
    if (inS && !prevIn && start === null) start = m;
    if (start !== null && inS && !set.has(m % 12 + 1)){ runs.push([start, m]); start = null; if (runs.length && i >= 12) break; } }
  const uniq = [...new Map(runs.map(r => [r.join("-"), r])).values()];
  return uniq.map(([a, z]) => a === z ? MN[lang][a-1] : `${MN[lang][a-1]} – ${MN[lang][z-1]}`).join(", ");
}
function seasonHtml(p){
  const n = SNOTE[p.id];
  return `<div class="season"><small>🗓 ${T[lang].best}: ${bestText(p.best)}</small>
    <div class="mstrip">${MS[lang].map((m, i) => `<i class="${p.best.includes(i+1) ? "g" : ""}${i+1 === NOWM ? " now" : ""}" title="${MN[lang][i]}">${m}</i>`).join("")}</div>
    ${n ? `<div class="snote">${n[lang]}</div>` : ""}</div>`;
}

// ---------------- weather (Open-Meteo, free, no key) ----------------
const WX = {}, WXC = c => c === 0 ? ["☀️","clear"] : c <= 2 ? ["🌤","partly"] : c === 3 ? ["☁️","cloudy"] : c <= 48 ? ["🌫","fog"] : c <= 57 ? ["🌦","drizzle"] : c <= 67 ? ["🌧","rain"] : c <= 82 ? ["🌦","showers"] : ["⛈","storm"];
const WXT = {clear:{si:"පැහැදිලියි",ta:"தெளிவு",en:"Clear"}, partly:{si:"වලාකුළු ස්වල්පයක්",ta:"ஓரளவு மேகம்",en:"Partly cloudy"}, cloudy:{si:"වලාකුළු",ta:"மேகமூட்டம்",en:"Cloudy"},
  fog:{si:"මීදුම",ta:"மூடுபனி",en:"Fog"}, drizzle:{si:"පොද වැසි",ta:"தூறல்",en:"Drizzle"}, rain:{si:"වැසි",ta:"மழை",en:"Rain"}, showers:{si:"වැසි ඇති විය හැක",ta:"மழைத் தூறல்",en:"Showers"}, storm:{si:"ගිගුරුම් සහිත වැසි",ta:"இடியுடன் மழை",en:"Thunderstorms"}};
async function loadWx(id){
  const p = BY[id], box = document.querySelector(`.wx[data-id="${id}"]`); if (!box) return;
  const cached = WX[id];
  if (!cached || Date.now() - cached.t > 30*60*1000){
    box.textContent = T[lang].wxload;
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FColombo&forecast_days=3`;
      const r = await fetch(u); if (!r.ok) throw 0; WX[id] = {t:Date.now(), d:(await r.json()).daily};
    } catch(e){ const b2 = document.querySelector(`.wx[data-id="${id}"]`); if (b2) b2.textContent = T[lang].wxfail; return; }
  }
  const d = WX[id].d, b = document.querySelector(`.wx[data-id="${id}"]`); if (!b) return;
  const dayName = (s, i) => i === 0 ? T[lang].today : i === 1 ? T[lang].tomorrow : WD[lang][new Date(s + "T12:00:00+05:30").getUTCDay()];
  b.innerHTML = `<div class="days">${d.time.map((t, i) => { const [ic, k] = WXC(d.weather_code[i]); return `<div><b>${dayName(t, i)}</b><div class="ic" title="${WXT[k][lang]}">${ic}</div>
    <div class="t">${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</div><div class="r">💧 ${d.precipitation_probability_max[i] ?? "–"}%</div></div>`; }).join("")}</div>
    <span class="src">${T[lang].wxsrc} <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></span>`;
}

function popup(p){
  const k = CATS[p.c], inTrip = trip.includes(p.id);
  const vis = visited.has(p.id);
  return `<div class="pop">${WIKI[p.id] ? `<div class="photo" data-id="${p.id}"></div>` : ""}<h3>${name(p)}</h3><div class="alt">${alt(p)}</div>
    <span class="tag"><span>${k.e}</span>${k[lang]} · ${dname(p.d)}</span>
    <div><button class="vbtn${vis ? " on" : ""}" onclick="popVisited('${p.id}')">${vis ? T[lang].vyes : T[lang].vno}</button></div>

      <a class="btn btn-teal" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${gq(p)}">${T[lang].dir}</a>
      <a class="btn btn-amber" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("restaurants near " + p.en + ", Sri Lanka")}">${T[lang].food}</a>
      <button class="btn ${inTrip ? "btn-teal" : "btn-light"}" onclick="popTrip('${p.id}')">${inTrip ? T[lang].added : T[lang].add}</button>

window.popTrip = id => setTimeout(() => toggleTrip(id), 0);
window.share = id => {
  const p = BY[id], url = location.href.split("#")[0] + "#" + id;
  if (navigator.share) navigator.share({title:name(p), text:name(p) + " – " + T[lang].title, url}).catch(()=>{});
  else navigator.clipboard?.writeText(url).then(() => toast(T[lang].copied));

// ---------------- filters & list ----------------
const hav = (a, b) => { const R = 6371, r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLo = (b.lng-a.lng)*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
const norm = s => s.toLowerCase().normalize("NFC");
function filtered(){
  const qq = norm(q.trim());
  let r = PLACES.filter(p => (cat === "all" || p.c === cat) && (!dist || p.d === dist) && (!month || p.best.includes(month)) &&
    (!qq || norm([p.en,p.si,p.ta,p.d,DN.si[p.d],DN.ta[p.d],p.den,p.dsi,p.dta].join(" ")).includes(qq)));
  if (me) r = r.map(p => ({...p, km:hav(me, p)})).sort((a,b) => a.km - b.km);
  return r;
}
function render(){
  const r = filtered();
  cluster.clearLayers(); cluster.addLayers(r.map(p => markers[p.id]));
  $("count").textContent = T[lang].count(r.length);
  $("list").innerHTML = r.length ? r.map(p => { const k = CATS[p.c], inT = trip.includes(p.id); return `<div class="card${p.id===selId?" sel":""}" data-id="${p.id}" tabindex="0">
      <div class="dot" style="background:${k.c}">${k.e}</div>
      <div><b>${name(p)}${visited.has(p.id) ? '<span class="star" title="✓">⭐</span>' : ""}</b><div class="meta">${k[lang]} · ${dname(p.d)}${month && p.best.length < 12 ? `<span class="good">✓ ${MN[lang][month-1]}</span>` : ""}</div></div>
      <div class="side"><button class="add${inT?" in":""}" data-add="${p.id}" aria-label="${inT?T[lang].added:T[lang].add}" title="${inT?T[lang].added:T[lang].add}">${inT?"✓":"+"}</button>
      ${p.km != null ? `<span class="km">${p.km < 10 ? p.km.toFixed(1) : Math.round(p.km)} ${T[lang].km}</span>` : ""}</div></div>`; }).join("")
    : `<div class="empty">${T[lang].empty}</div>`;
  $("list").querySelectorAll(".card").forEach(c => { c.onclick = e => { if (e.target.closest(".add")) return; select(c.dataset.id, true); }; c.onkeydown = e => { if (e.key === "Enter") select(c.dataset.id, true); }; });
  $("list").querySelectorAll(".add").forEach(b => b.onclick = () => toggleTrip(b.dataset.add));
}
let keepPopup = false;
function refreshAll(){
  const openId = selId && markers[selId].isPopupOpen() ? selId : null;
  keepPopup = true;
  PLACES.forEach(p => markers[p.id].setIcon(pinIcon(p)));
  render(); renderTrip();
  keepPopup = false;
  if (openId){ selId = openId; const m = markers[openId];
    if (!m.isPopupOpen()) cluster.zoomToShowLayer(m, () => m.openPopup()); else { m.setPopupContent(popup(BY[openId])); loadWx(openId); loadPhoto(openId); }
    document.querySelectorAll(".pin").forEach(el => el.classList.toggle("sel", el.dataset.id === openId)); }
}
function select(id, fly){
  selId = id; const p = BY[id], m = markers[id];
  if (!cluster.hasLayer(m)) cluster.addLayer(m);
  if (fly){ map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 12), {duration:.8}); setTimeout(() => cluster.zoomToShowLayer(m, () => m.openPopup()), 850);
    if (innerWidth <= 820) window.scrollTo({top:0, behavior:"smooth"}); }
  document.querySelectorAll(".pin").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  document.querySelectorAll(".card").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  const card = document.querySelector(`.card[data-id="${id}"]`); if (card && !fly && innerWidth > 820) card.scrollIntoView({block:"nearest", behavior:"smooth"});
  history.replaceState(null, "", "#" + id);
}
map.on("popupclose", () => { if (keepPopup) return; selId = null; document.querySelectorAll(".pin.sel,.card.sel").forEach(el => el.classList.remove("sel")); history.replaceState(null, "", location.pathname + location.search); });
map.on("zoomend moveend", () => document.querySelectorAll(".pin").forEach(el => el.classList.toggle("sel", el.dataset.id === selId)));

function buildChips(){
  $("chips").innerHTML = `<button class="chip${cat==="all"?" on":""}" data-c="all">${T[lang].all}</button>` +
    Object.entries(CATS).map(([k,v]) => `<button class="chip${cat===k?" on":""}" data-c="${k}"><i style="background:${v.c}"></i>${v.e} ${v[lang]}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { cat = b.dataset.c; buildChips(); render(); renderOsm(); });
}
function buildDist(){
  const ds = [...new Set(PLACES.map(p => p.d))].sort((a,b) => dname(a).localeCompare(dname(b), lang));
  $("dist").innerHTML = `<option value="">${T[lang].alld}</option>` + ds.map(d => `<option value="${d}"${d===dist?" selected":""}>${dname(d)}</option>`).join("");
}
$("dist").onchange = e => {
  dist = e.target.value; render();
  if (hiDist){ map.removeLayer(hiDist); hiDist = null; }
  if (dist){ const f = DISTRICTS.features.find(f => f.properties.n === dist);
    hiDist = L.geoJSON(f, {style:{color:"#E8A33A", weight:3, fillColor:"#E8A33A", fillOpacity:.08}, interactive:false}).addTo(map);
    map.flyToBounds(hiDist.getBounds(), {padding:[30,30], duration:.8}); }
  else map.flyToBounds(SL, {duration:.8});
};
$("q").oninput = e => { q = e.target.value; render(); };
function buildMonth(){
  $("month").innerHTML = `<option value="0">${T[lang].anym}</option>` + MN[lang].map((m, i) => `<option value="${i+1}"${month===i+1?" selected":""}>${T[lang].goin} ${m}${i+1===NOWM ? " · " + T[lang].thism : ""}</option>`).join("");
  $("month").value = month; $("month").parentElement.classList.toggle("on", !!month);
}
$("month").onchange = e => { month = +e.target.value; buildMonth(); render(); };
$("reset").onclick = e => { e.preventDefault(); q = ""; $("q").value = ""; cat = "all"; dist = ""; month = 0; buildMonth(); buildChips(); buildDist(); $("dist").onchange({target:{value:""}}); };

let meMarker = null;
$("near").onclick = () => {
  if (!navigator.geolocation) return toast(T[lang].locfail);
  toast(T[lang].locating);
  navigator.geolocation.getCurrentPosition(pos => {
    me = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    if (meMarker) meMarker.remove();
    meMarker = L.marker([me.lat, me.lng], {icon:L.divIcon({className:"", html:'<div class="me"></div>', iconSize:[18,18], iconAnchor:[9,9]}), zIndexOffset:1000}).addTo(map).bindTooltip(T[lang].you);
    render(); const r = filtered().slice(0,5);
    map.flyToBounds(L.latLngBounds([[me.lat, me.lng], ...r.map(p => [p.lat, p.lng])]), {padding:[40,40], maxZoom:12, duration:.8});
  }, () => toast(T[lang].locfail), {enableHighAccuracy:true, timeout:10000});
};
$("foodNear").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent("restaurants near me");

  document.querySelectorAll("[data-i]").forEach(el => { const v = T[l][el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  document.title = T[l].title + (l === "en" ? " · ලංකා ගමන් සිතියම" : " · Sri Lanka Travel Map");
  $("q").placeholder = T[l].q;

  $("legend").innerHTML = Object.values(CATS).map(v => `<span><i style="background:${v.c}">${v.e}</i>${v[l]}</span>`).join("");
  if (isIOS && !standalone) $("inst_s").textContent = T[l].i_ios;

}

const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let deferred = null;
const showInst = () => { if (!standalone && !store.get("inst_closed")) setTimeout(() => $("inst").classList.add("show"), 5000); };
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("instLink").hidden = false; showInst(); });

$("inst_go").onclick = doInstall; $("instLink").onclick = doInstall;

const saved = store.get("lang"), nav = (navigator.language || "").slice(0,2);
setLang(["si","ta","en"].includes(saved) ? saved : nav === "ta" ? "ta" : "si");
saveTrip(); saveVis();
const hraw = location.hash.slice(1), h = hraw.startsWith("trip=") ? hraw : decodeURIComponent(hraw);
if (h.startsWith("trip=")){
  const ids = h.slice(5).split(",").map(x => { try { return decodeURIComponent(x); } catch(e){ return x; } }).filter(id => getP(id));
  if (ids.length){ trip = ids; saveTrip(); refreshAll(); toast(T[lang].tshared); setTimeout(openTrip, 400); }
} else if (h && markers[h]) setTimeout(() => select(h, true), 300);
